<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post 3 — Fé & Ciência</title>
    <link rel="stylesheet" href="main.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Work+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 1080px; height: 1350px; overflow: hidden; }

        body {
            font-family: var(--ff-body, 'Work Sans', sans-serif);
            background: linear-gradient(135deg, var(--c-bg-light) 0%, var(--c-bg-light-2) 100%);
            --c-author-badge-text: var(--c-text-on-light);
            --c-author-badge-muted: var(--c-text-muted);
            position: relative;
        }

        .quote-icon {
            position: absolute;
            top: 60px; left: 80px;
            font-family: var(--ff-heading, 'Playfair Display', serif);
            font-size: 280px;
            color: var(--c-accent-15);
            line-height: 1;
            z-index: 1;
            pointer-events: none;
            user-select: none;
        }

        .post {
            position: relative;
            z-index: 2;
            width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            padding: 100px;
            justify-content: center;
            text-align: center;
        }

        .kicker {
            font-size: var(--fs-kicker);
            font-weight: 600;
            letter-spacing: .1em;
            text-transform: uppercase;
            color: var(--c-accent);
            margin-bottom: 30px;
        }

        h1 {
            font-family: var(--ff-heading, 'Playfair Display', serif);
            font-size: var(--fs-h1);
            font-weight: 700;
            line-height: 1.15;
            color: var(--c-text-on-light);
            margin-bottom: 50px;
        }

        .body-text {
            font-size: var(--fs-body);
            color: var(--c-text-muted);
            line-height: 1.6;
            margin: 0 auto 60px;
            max-width: 800px;
        }
        
        strong {
            color: var(--c-accent);
        }

        .bottom {
            position: absolute;
            bottom: 80px; left: 96px; right: 96px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-top: 40px;
            border-top: 1px solid var(--c-text-muted-20);
        }
        /* author-badge--sm via main.css */
        .cta-tag {
            padding: 10px 28px;
            border-radius: 999px;
            background: var(--c-surface);
            border: 2px solid var(--c-accent);
            color: var(--c-accent);
            font-weight: 700;
            font-size: var(--fs-cta);
        }
    </style>
</head>
<body>
    <div class="quote-icon">&ldquo;</div>

    <div class="post">
        <div>
            <p class="kicker" data-var="kicker" data-var-label="Kicker">Fé que transforma</p>
            <h1 data-var="headline" data-var-label="Headline">Por que estudar<br>neurociência me fez<br>confiar mais em Deus.</h1>
            <p class="body-text" data-var="body" data-var-label="Corpo do texto">A ciência do comportamento não contradiz a fé. Ela nos ensina <strong>como</strong> somos feitos, enquanto a fé nos lembra <strong>por quem</strong> e <strong>para quê</strong>.</p>
        </div>

        <div class="bottom">
            <div class="author-badge author-badge--sm" data-badge data-badge-size="sm">
                <div class="badge-photo-outer badge-photo-outer--sm">
                    <div class="badge-photo">
                        <img src="assets/foto-ligia-badge.jpg" alt="Lígia Flauzino" data-badge-photo />
                    </div>
                </div>
                <div class="badge-info">
                    <span class="badge-name">Lígia Flauzino</span>
                    <span class="badge-handle">@ligiaflauzino</span>
                </div>
            </div>
            <span class="cta-tag" data-var="cta" data-var-label="CTA">Leia o post completo</span>
        </div>
    </div>
</body>
</html>
